name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # Classic, bullet-proof method: push built dist to gh-pages branch.
      # Pages source = gh-pages branch (set once in repo Settings -> Pages).
      - name: Publish to gh-pages
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp -r dist/. .
          git add -A
          git commit -m "pages build: $(git rev-parse --short origin/main)" --allow-empty
          git push --force origin gh-pages
